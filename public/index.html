<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RollOut — Marble Racing Game (Phase 1)</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        background: #1a1a1a;
        color: #ffffff;
        overflow: hidden;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #info-panel {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.7);
        padding: 15px;
        border-radius: 8px;
        font-size: 14px;
        z-index: 10;
        line-height: 1.6;
      }

      #controls-panel {
        position: absolute;
        bottom: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.7);
        padding: 15px;
        border-radius: 8px;
        font-size: 12px;
        z-index: 10;
      }

      .key {
        display: inline-block;
        background: #444;
        border: 1px solid #888;
        padding: 4px 8px;
        border-radius: 4px;
        margin: 0 2px;
        font-family: monospace;
      }

      #phase-indicator {
        position: absolute;
        top: 10px;
        right: 10px;
        background: rgba(255, 100, 100, 0.8);
        padding: 10px 15px;
        border-radius: 8px;
        font-weight: bold;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="phase-indicator">PHASE 1: Foundation</div>

    <div id="info-panel">
      <div><strong>🎮 RollOut - Marble Racing</strong></div>
      <div style="font-size: 11px; color: #aaa; margin-top: 8px">
        Phase 1 Physics Prototype
      </div>
    </div>

    <div id="controls-panel">
      <div><strong>Controls:</strong></div>
      <div>
        Use <span class="key">←</span> <span class="key">→</span> to steer
      </div>
      <div>Or drag/tap on mobile to steer</div>
      <div style="margin-top: 8px; color: #aaa">
        Watch the red marble fall and respond to steering!
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
